
# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf

# monitor=eDP-1,preferred,auto,1.
# monitor = DP-2, preferred, auto, 1.25, transform = 2

# env = LIBVA_DRIVER_NAME,nvidia
# env = GBM_BACKEND,nvidia-drm
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia

env = XDG_SESSION_TYPE,wayland

# Force apps to use native Wayland instead of XWayland (avoids blurry rendering)
env = MOZ_ENABLE_WAYLAND,1
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,wayland

# XWayland scaling — force_zero_scaling disables compositor upscaling,
# then GDK_SCALE/QT_SCALE_FACTOR tell XWayland apps what scale to render at.
# Set to 1 to match your 1.0-scale external monitors. On the 1.25 laptop
# display, XWayland apps will look slightly small — but sharp, not blurry.
env = GDK_SCALE,1
env = QT_SCALE_FACTOR,1
xwayland {
  force_zero_scaling = true
}


cursor {
    no_hardware_cursors = true
}

monitor = desc:Dell Inc. DELL P2723DE 2SZFH14,preferred,0x0,1.0
monitor = desc:Dell Inc. DELL P2723DE JRZFH14,preferred,2560x0,1.0
monitor = ,preferred,auto,1.0
monitor = eDP-1,preferred,auto,1.25



$terminal = kitty
$fileManager = nautilus
$browser = firefox
$menu = fuzzel


### AUTOSTART ###


# exec-once = $terminal
# exec-once = nm-applet &
exec-once = ln -sf $XDG_RUNTIME_DIR/hypr /tmp/hypr
exec-once = waybar & hyprpaper
exec-once = ~/.config/waybar/slack-status.py
exec-once = hyprsunset
exec-once = systemctl --user import-environment PATH WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --systemd PATH WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland


### ENVIRONMENT VARIABLES ###

env = XCURSOR_SIZE,20
env = HYPRCURSOR_SIZE,20
env = GTK-THEME,Catppuccin-Mocha


general {
    gaps_in = 1
    gaps_out = 0
    border_size = 1

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(7555ffee)
    col.inactive_border = rgba(00000044)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    allow_tearing = false

    layout = dwindle
}

decoration {

    shadow {
        enabled = true
        range = 30
        render_power = 3
        color = rgba(00000044)
    }

    blur {
        enabled = true
        size = 3
        passes = 3
    }
}

animations {
    enabled = no

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 0.5, 10, default
    animation = border, 1, 2, easeOutQuint
    animation = windows, 0.7, 2, quick
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear

    animation = fadeOut, 1, 1, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 2, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.25, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true
    preserve_split = true # You probably want this
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}

input {
    kb_layout = us,no
    kb_variant =
    kb_model =
    kb_options = ctrl:nocaps
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
    # workspace_swipe = true
}

# Example per-device config
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

### KEYBINDINGS
$mainMod = SUPER

bind = $mainMod, return, exec, $terminal
bind = $mainMod, backspace, exec, $browser
bind = $mainMod SHIFT, Q, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, D, exec, $menu
bind = $mainMod, F, fullscreen
bind = $mainMod, S, layoutmsg, togglesplit
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod, W, pseudo,
bind = $mainMod SHIFT, E, exit,
bind = $mainMod SHIFT, R, exec, hyprctl reload

bind = $mainMod, period, exec, hyprctl switchxkblayout all 0
bind = $mainMod, comma, exec, hyprctl switchxkblayout all 1

bind = $mainMod SHIFT, period, exec, hyprlock-live --grace 600

# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d


bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d


# HDMI monitor (JRZFH14): z x c
workspace = 1, defaultName:z, monitor:desc:Dell Inc. DELL P2723DE JRZFH14, default:true, persistent:1
workspace = 2, defaultName:x, monitor:desc:Dell Inc. DELL P2723DE JRZFH14, persistent:1
workspace = 3, defaultName:c, monitor:desc:Dell Inc. DELL P2723DE JRZFH14, persistent:1

# DP/USB monitor (2SZFH14): y u i o p — primary
workspace = 4, defaultName:y, monitor:desc:Dell Inc. DELL P2723DE 2SZFH14, persistent:1
workspace = 5, defaultName:u, monitor:desc:Dell Inc. DELL P2723DE 2SZFH14, default:true, persistent:1
workspace = 6, defaultName:i, monitor:desc:Dell Inc. DELL P2723DE 2SZFH14, persistent:1
workspace = 7, defaultName:o, monitor:desc:Dell Inc. DELL P2723DE 2SZFH14, persistent:1
workspace = 8, defaultName:p, monitor:desc:Dell Inc. DELL P2723DE 2SZFH14, persistent:1

# Numbered workspaces
workspace = 9, defaultName:1
workspace = 10, defaultName:2
workspace = 11, defaultName:3
workspace = 12, defaultName:4
workspace = 13, defaultName:5
workspace = 14, defaultName:6
workspace = 15, defaultName:7
workspace = 16, defaultName:8
workspace = 17, defaultName:9
workspace = 18, defaultName:0

# Switch to workspaces
bind = $mainMod, z, workspace, 1
bind = $mainMod, x, workspace, 2
bind = $mainMod, c, workspace, 3
bind = $mainMod, y, workspace, 4
bind = $mainMod, u, workspace, 5
bind = $mainMod, i, workspace, 6
bind = $mainMod, o, workspace, 7
bind = $mainMod, p, workspace, 8
bind = $mainMod, 1, workspace, 9
bind = $mainMod, 2, workspace, 10
bind = $mainMod, 3, workspace, 11
bind = $mainMod, 4, workspace, 12
bind = $mainMod, 5, workspace, 13
bind = $mainMod, 6, workspace, 14
bind = $mainMod, 7, workspace, 15
bind = $mainMod, 8, workspace, 16
bind = $mainMod, 9, workspace, 17
bind = $mainMod, 0, workspace, 18

# Move windows to workspaces
bind = $mainMod SHIFT, z, movetoworkspacesilent, 1
bind = $mainMod SHIFT, x, movetoworkspacesilent, 2
bind = $mainMod SHIFT, c, movetoworkspacesilent, 3
bind = $mainMod SHIFT, y, movetoworkspacesilent, 4
bind = $mainMod SHIFT, u, movetoworkspacesilent, 5
bind = $mainMod SHIFT, i, movetoworkspacesilent, 6
bind = $mainMod SHIFT, o, movetoworkspacesilent, 7
bind = $mainMod SHIFT, p, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 10
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 11
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 12
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 13
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 14
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 15
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 16
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 17
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 18


# Example special workspace (scratchpad)
bind = $mainMod, A, togglespecialworkspace, magic
bind = $mainMod SHIFT, A, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod SHIFT, mouse:272, resizewindow

# Lid switch — disable laptop screen on close, re-enable on open
bindl = , switch:on:Lid Switch, exec, hyprctl keyword monitor eDP-1,disabled
bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor eDP-1,preferred,auto,1.25

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindel = ,XF86MonBrightnessUp, exec, brightnessctl s --min-value=1 --exponent=4 7%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s --min-value=1 --exponent=4 7%-
# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# ─── feh (image viewer) ───────────────────────────────────────────────────
# feh is X11-only and runs under XWayland. Its window class is always "feh"
# (feh has no --class option), so this rule applies to every feh window.
#
# NOTE: this Hyprland (0.54) uses the *block* windowrule syntax — matchers are
# "match:<field>" and rules are snake_case fields (no_blur, not noblur). The
# old one-liner form (windowrule = float, class:^(feh)$) is rejected by this
# build with "invalid field float: missing a value"; `hyprctl configerrors`
# is the fastest way to check a rule after editing.
windowrule {
    name = feh-image-viewer
    match:class = ^feh$

    # Without float, Hyprland tiles feh and throws away feh's own
    # --scale-down sizing, squeezing a 4K image into a tile.
    float = yes
    center = yes

    # feh's --scale-down sizes to the raw screen height and knows nothing
    # about the 24px reserved bar, so a 4K image opens overflowing the
    # bottom edge and clips feh's own info overlay. Cap it to a tidy inset
    # window on the 2560x1440 displays; the cap is inert on the smaller
    # laptop panel, where --scale-down is already the tighter limit.
    max_size = 2400 1340

    # Never blur or dim an image — you want to see the actual pixels.
    no_blur = yes
    no_dim = yes

    # Don't let the screen lock during a fullscreen slideshow (feh -T sl).
    idle_inhibit = fullscreen
}


# The fullscreen, input-transparent surface hyprlock-blur puts up while the
# screen is locked. It carries no pixels of its own worth looking at — the blur
# rule is the whole point: it makes Hyprland blur the live desktop below it,
# every frame, so what's behind the lock screen keeps updating instead of being
# a still screenshot. hyprlock's own surface renders above this, so the input
# field stays sharp.
layerrule {
    name = lockblur
    match:namespace = ^lockblur$

    blur = true
}
