;  https://github.com/polybar/polybar

[colors]
background = #1B1F3B
transparent = #00000000
background-alt = #1B1F3B
foreground = #EEEEEE
primary = #7555FF
secondary = #7555FF
alert = #A54242
disabled = #707880
charging = #6CD4FF
red = #FF0000
green = #44DD99

[bar/base]
;monitor = HDMI-1
monitor = DVI-I-1-1
monitor-fallback = eDP-1
bottom = true
width = 100%
height = 20
radius = 0

; dpi = 96
dpi = 93

background = ${colors.transparent}
foreground = ${colors.foreground}


padding-left = 0
padding-right = 0

module-margin = 1

;font-0 = monospace;
font-0 = "TerminessNerdFontPropo: size=16: weight=bold;3"

modules-left = xworkspaces
modules-right = wlan eth xkeyboard pulseaudio  battery
modules-center = date
cursor-click = pointer
;cursor-scroll = ns-resize

enable-ipc = true

;tray-position = right

;wm-restack = i3
override-redirect = false

border-top-size = 0
border-bottom-size = 0 
border-left-size = 0
border-right-size = 8


[module/xworkspaces]

pin-workspaces = false
type = internal/xworkspaces
label-active = %name%
label-active-foreground = ${colors.background}
label-active-background = ${colors.primary}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1
label-occupied-foreground = ${colors.primary}
label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%


[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "V"
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%


label-muted = M
label-muted-foreground = ${colors.disabled}

[module/backlight]
type = internal/backlight
use-actual-brightness=true
card = intel_backlight
;enable-scroll = true

format = <label>
format-prefix = L
format-prefix-foreground = ${colors.primary}
label = %percentage%

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[network-base]
type = internal/network
interval = 1

format-disconnected = <label-disconnected>

[module/wlan]
inherit = network-base

interface = wlp0s20f3
interface-type = wireless

ramp-signal-0 = "%{F#7555FF}|%{F#EEEEEE}||||"
ramp-signal-1 = "%{F#7555FF}||%{F#EEEEEE}|||"
ramp-signal-2 = "%{F#7555FF}|||%{F#EEEEEE}||"
ramp-signal-3 = "%{F#7555FF}||||%{F#EEEEEE}|"
ramp-signal-4 = "%{F#7555FF}|||||%{F#EEEEEE}"
; ramp-signal-5 = "%{F#7555FF}||||||%{F#EEEEEE}"

format-connected = <label-connected>
label-connected = wifi 
label-disconnected = ""

label-connected-foreground = ${colors.green}
label-disconnected-foreground = ${colors.red}

[module/eth]

inherit = network-base

interface-type = wired

format-connected = <label-connected> 
label-connected = eth
label-disconnected = ""

label-connected-foreground = ${colors.green}

[module/battery]
type = internal/battery
full-at = 90
low-at = 20
battery = BAT0
adapter = ADP1
poll-interval = 1
time-format = %H:%M

format-charging-prefix-foreground = ${colors.primary}
format-charging-prefix = "E"
format-charging = <label-charging>
; format-charging = <label-charging><animation-charging> 
label-charging-foreground = ${colors.charging}
label-charging = %percentage% 

format-discharging-prefix-foreground = ${colors.primary}
format-discharging-prefix = "E"
format-discharging = <label-discharging>
label-discharging = %percentage%


format-low-prefix-foreground = ${colors.primary}
format-low-prefix = "E"
format-low = <label-low><animation-low>
label-low = %percentage%

format-full-prefix-foreground = ${colors.primary}
format-full-prefix = "E"
format-full = <label-full> 
label-full-foreground = ${colors.foreground}
label-full = %percentage%

animation-charging-0 = -
animation-charging-1 = <
animation-charging-2 = |
animation-charging-3 = >
animation-charging-4 = -
animation-charging-framerate = 256

animation-low-0 = !
animation-low-1 = " "
animation-low-framerate = 200

[module/date]
type = internal/date
interval = 1

date = %H%M %d/%m

label = %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = false



; vim:ft=dosini
